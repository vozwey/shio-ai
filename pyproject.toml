[project]
name = "shioai"
version = "0.1.0"
description = "Telegram-бот с LLM-бэкендом через OpenAI-совместимое API"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "ddgs>=4.0.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "trafilatura>=2.0.0",
]

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
